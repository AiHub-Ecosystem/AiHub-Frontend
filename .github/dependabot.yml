# Workflow actions are pinned to commit SHAs (tests/unit/workflow-pins.test.ts),
# so this is what keeps those SHAs current: each bump arrives as a pull request
# that rewrites the SHA and its version comment together.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
